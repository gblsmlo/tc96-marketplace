name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      - run: ./scripts/release.sh
